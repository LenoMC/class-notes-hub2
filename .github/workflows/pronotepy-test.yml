name: pronotepy-test
on:
  workflow_dispatch:
    inputs:
      qr:  { required: true }
      pin: { required: true }
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install pronotepy
      - run: python scripts/pronotepy_test.py
        env:
          QR: ${{ inputs.qr }}
          PIN: ${{ inputs.pin }}
